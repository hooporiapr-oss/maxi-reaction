<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (sessionStorage.getItem('reaction-velocity-gate-pass') !== '1' && sessionStorage.getItem('hoop-fullgame-active') !== '1') {
  window.location.replace('index.html');
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Final Score — Reaction Velocity</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  overflow:hidden;
  background:#000;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:radial-gradient(ellipse at center,#12060a 0%,#000 70%);
}

#panel{
  position:relative;
  z-index:2;
  width:100%;
  max-width:560px;
  max-height:100%;
  overflow-y:auto;
  text-align:center;
}

.buzzer{
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#ff1e3c;
  margin-bottom:8px;
}
.final-title{
  font-size:1.8rem;
  font-weight:900;
  font-style:italic;
  letter-spacing:.02em;
  text-transform:uppercase;
  text-shadow:0 0 40px rgba(255,30,60,.6);
  margin-bottom:28px;
}
.final-title span{color:#ff1e3c}

.qs-board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-bottom:24px}
.qs-cell{border-radius:14px;border:2px solid rgba(255,30,60,.35);background:rgba(255,30,60,.06);padding:16px 4px}
.qs-label{font-size:.56rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#ffb3ba;margin-bottom:6px;line-height:1.25}
.qs-val{font-size:1.6rem;font-weight:900;color:#fff}

.total-row{
  border-radius:20px;
  border:2px solid rgba(255,107,53,.5);
  background:linear-gradient(135deg,rgba(255,107,53,.18),rgba(255,255,255,.03));
  padding:24px;
  margin-bottom:28px;
  box-shadow:0 0 50px rgba(255,107,53,.35);
}
.total-label{font-size:.72rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#ffb38a;margin-bottom:6px}
.total-val{font-size:3.2rem;font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,107,53,.7)}

.action-btn{
  display:block;
  width:100%;
  height:60px;
  border:none;
  border-radius:18px;
  font-size:1rem;
  font-weight:900;
  letter-spacing:.05em;
  text-transform:uppercase;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
}
.action-btn:active{transform:scale(.98)}
.action-btn.primary{background:linear-gradient(135deg,#ff1e3c,#ff6b35);color:#fff;box-shadow:0 0 40px rgba(255,30,60,.6)}
.action-btn.secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.25)}

footer{margin-top:16px;font-size:.68rem;color:#6b5d52;letter-spacing:.02em}

/* Standings — in-page board, ported from the working dropdown
   pattern, now living here instead of a separate external page. */
#screen-box{display:none;position:fixed;inset:0;z-index:200;flex-direction:column;align-items:center;background:radial-gradient(ellipse at center,#12060a 0%,#000 70%);padding:20px 16px 24px;overflow-y:auto}
.box-back-btn{align-self:flex-start;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;cursor:pointer;margin-bottom:20px}
.box-empty{color:#8892a0;font-size:.85rem;padding:24px 8px;font-style:italic;text-align:center}
.standings-row-header,.standings-row-main{display:grid;grid-template-columns:28px 1fr 60px 22px;gap:8px;align-items:center;padding:12px 10px;border-radius:10px;width:100%;max-width:520px}
.standings-row-header{font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#8892a0;padding:0 10px 8px}
.standings-row{width:100%;max-width:520px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:6px;overflow:hidden;cursor:pointer}
.standings-row.rank-1{border-color:rgba(255,211,90,.5);background:rgba(255,211,90,.08)}
.standings-row.rank-2{border-color:rgba(200,200,220,.4);background:rgba(200,200,220,.06)}
.standings-row.rank-3{border-color:rgba(255,140,66,.4);background:rgba(255,140,66,.06)}
.sr-rank{font-weight:900;color:#ff1e3c}
.standings-row.rank-1 .sr-rank{color:#ffd35a}
.sr-name{text-align:left;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-total{font-weight:900;color:#fff;font-size:1rem;text-align:right}
.sr-chevron{color:#7c8699;font-size:.7rem;transition:transform .18s;text-align:center}
.standings-row.open .sr-chevron{transform:rotate(180deg)}
.standings-detail{max-height:0;overflow:hidden;transition:max-height .2s ease}
.standings-row.open .standings-detail{max-height:170px}
.standings-detail-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 8px 10px}
.sd-cell{text-align:center;padding:8px 2px;border-radius:8px;background:rgba(255,255,255,.04)}
.sd-label{font-size:.52rem;font-weight:900;letter-spacing:.02em;text-transform:uppercase;color:#8892a0;margin-bottom:3px;line-height:1.15}
.sd-val{font-size:.95rem;font-weight:900;color:#fff}
.sd-final{text-align:center;padding:0 12px 14px;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#8892a0}
.sd-final b{color:#fff;font-size:1rem;margin-left:6px}
.standings-wrap{width:100%;display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<div id="stage">
  <div id="panel">
    <div class="buzzer">🔔 Final Buzzer</div>
    <div class="final-title">GAME <span>COMPLETE</span></div>

    <div class="qs-board">
      <div class="qs-cell"><div class="qs-label">1 Reactific</div><div class="qs-val" id="fsQ1">0</div></div>
      <div class="qs-cell"><div class="qs-label">2 Reaction Speed</div><div class="qs-val" id="fsQ2">0</div></div>
      <div class="qs-cell"><div class="qs-label">3 Shoot It. Own It.</div><div class="qs-val" id="fsQ3">0</div></div>
      <div class="qs-cell"><div class="qs-label">4 Make It Count.</div><div class="qs-val" id="fsQ4">0</div></div>
    </div>

    <div class="total-row">
      <div class="total-label">Final Score</div>
      <div class="total-val" id="fsTotal">0</div>
    </div>

    <div id="standingsStatus" style="font-size:.78rem;font-weight:700;letter-spacing:.04em;color:#8892a0;margin:-10px 0 20px">Saving to standings…</div>

    <button class="action-btn primary" id="playAgainBtn">🏀 PLAY AGAIN</button>
    <button class="action-btn secondary" id="viewStandingsBtn">🏆 THE STANDINGS</button>
    <a class="action-btn secondary" href="reaction-velocity.html">← Back to the Arena</a>

    <footer>Gostar Digital LLC</footer>
  </div>
</div>

<!-- THE STANDINGS -->
<div id="screen-box">
  <button class="box-back-btn" id="closeBoxBtn">← Back</button>
  <div class="final-title" style="margin-bottom:2px">THE <span>STANDINGS</span></div>
  <div style="font-size:.72rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#ffb38a;margin-bottom:20px">Reaction Velocity · Best Final Score Per Player</div>
  <div class="standings-wrap">
    <div class="standings-row-header">
      <span></span><span style="text-align:left">Player</span><span style="text-align:right">Final</span><span></span>
    </div>
    <div id="standingsList" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  </div>
</div>

<script>
(function(){
function loadQuarterScores(){
  try{return JSON.parse(sessionStorage.getItem('hoop-quarter-scores')||'{"q1":0,"q2":0,"q3":0,"q4":0}')}
  catch(e){return {q1:0,q2:0,q3:0,q4:0}}
}
var scores=loadQuarterScores();
var total=scores.q1+scores.q2+scores.q3+scores.q4;
document.getElementById('fsQ1').textContent=scores.q1;
document.getElementById('fsQ2').textContent=scores.q2;
document.getElementById('fsQ3').textContent=scores.q3;
document.getElementById('fsQ4').textContent=scores.q4;
document.getElementById('fsTotal').textContent=total;

document.getElementById('playAgainBtn').addEventListener('click',function(){
  sessionStorage.setItem('hoop-fullgame-active','1');
  sessionStorage.setItem('hoop-quarter-scores',JSON.stringify({q1:0,q2:0,q3:0,q4:0}));
  window.location.href='vr-reactific.html';
});

// ══════════════════════════════════════════════════════
//  STANDINGS VIEW — in-page now, matching the pattern each individual
//  quarter game already uses, rather than linking out to a separate
//  page. Reads the same combined table every run's total gets saved
//  to below, with each player's row expanding to show their own
//  per-quarter breakdown.
// ══════════════════════════════════════════════════════
function fetchFullGameStandings(){
  var url=SUPABASE_URL+'/rest/v1/'+SB_TABLE+'?select=player_name,q1_score,q2_score,q3_score,q4_score,total_score&order=total_score.desc';
  return fetch(url,{headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}})
    .then(function(r){if(!r.ok)throw new Error('bad response');return r.json()})
    .then(function(rows){
      var best={};
      (rows||[]).forEach(function(r){
        var existing=best[r.player_name];
        if(!existing||r.total_score>existing.total){
          best[r.player_name]={name:r.player_name,q1:r.q1_score,q2:r.q2_score,q3:r.q3_score,q4:r.q4_score,total:r.total_score};
        }
      });
      return Object.keys(best).map(function(n){return best[n]}).sort(function(a,b){return b.total-a.total});
    });
}
function renderFullGameStandings(){
  var listEl=document.getElementById('standingsList');
  listEl.innerHTML='<div class="box-empty">Loading standings…</div>';
  fetchFullGameStandings().then(function(ranked){
    if(!ranked.length){
      listEl.innerHTML='<div class="box-empty">No players yet — be the first name on the board.</div>';
      return;
    }
    listEl.innerHTML=ranked.map(function(p,i){
      var rankClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
      var safeName=p.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      return '<div class="standings-row '+rankClass+'">'
        +'<div class="standings-row-main">'
          +'<span class="sr-rank">'+(i+1)+'</span>'
          +'<span class="sr-name">'+safeName+'</span>'
          +'<span class="sr-total">'+p.total+'</span>'
          +'<span class="sr-chevron">▼</span>'
        +'</div>'
        +'<div class="standings-detail"><div class="standings-detail-inner">'
          +'<div class="sd-cell"><div class="sd-label">1 Reactific</div><div class="sd-val">'+p.q1+'</div></div>'
          +'<div class="sd-cell"><div class="sd-label">2 Reaction Speed</div><div class="sd-val">'+p.q2+'</div></div>'
          +'<div class="sd-cell"><div class="sd-label">3 Shoot It.</div><div class="sd-val">'+p.q3+'</div></div>'
          +'<div class="sd-cell"><div class="sd-label">4 Make It Count.</div><div class="sd-val">'+p.q4+'</div></div>'
        +'</div><div class="sd-final">Final Score<b>'+p.total+'</b></div></div>'
        +'</div>';
    }).join('');
    listEl.querySelectorAll('.standings-row').forEach(function(row){
      row.addEventListener('click',function(){ row.classList.toggle('open'); });
    });
  }).catch(function(){
    listEl.innerHTML='<div class="box-empty">Couldn\'t load standings right now — try again in a moment.</div>';
  });
}
document.getElementById('viewStandingsBtn').addEventListener('click',function(){
  renderFullGameStandings();
  document.getElementById('stage').style.display='none';
  document.getElementById('screen-box').style.display='flex';
});
document.getElementById('closeBoxBtn').addEventListener('click',function(){
  document.getElementById('screen-box').style.display='none';
  document.getElementById('stage').style.display='flex';
});

// ══════════════════════════════════════════════════════
//  STANDINGS — one single board for the whole Full Game run, not
//  per-quarter. Written exactly once, here, the moment a run
//  genuinely completes — none of the four individual quarter games
//  write anything to this table themselves. Ranking is by total
//  score across all four quarters, not any single quarter's result.
//
//  The save status is shown directly on screen (#standingsStatus)
//  rather than only in the console — a silent failure here is
//  useless for actually diagnosing anything, so success or failure
//  is visible without needing dev tools open at all.
// ══════════════════════════════════════════════════════
var SUPABASE_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var SB_TABLE='reaction_velocity_standings';
var statusEl=document.getElementById('standingsStatus');

// Defensive coercion — if any quarter score ever came through as
// something other than a clean number (missing key, stray string,
// NaN), sending that straight to an integer NOT NULL column would
// get the whole insert rejected. Better to normalize to 0 here than
// let one bad field silently kill the entire write.
function toInt(v){ var n=Number(v); return isFinite(n) ? Math.round(n) : 0; }
var payload={
  player_name:(sessionStorage.getItem('hoop-player-name')||'Player').slice(0,40),
  q1_score:toInt(scores.q1),
  q2_score:toInt(scores.q2),
  q3_score:toInt(scores.q3),
  q4_score:toInt(scores.q4),
  total_score:toInt(total),
  school_name:sessionStorage.getItem('reaction-velocity-school')||null
};

saveToStandings(payload);

async function saveToStandings(payload){
  try{
    var res=await fetch(SUPABASE_URL+'/rest/v1/'+SB_TABLE,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_ANON_KEY,
        'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify(payload)
    });
    if(res.ok){
      statusEl.textContent='✓ Saved to standings';
      statusEl.style.color='#00D9A5';
    }else{
      var bodyText=await res.text().catch(function(){return ''});
      console.error('Reaction Velocity standings write failed:',res.status,bodyText);
      statusEl.textContent='⚠ Couldn\'t save (error '+res.status+') — score still stands above, just not on the board';
      statusEl.style.color='#FF6B35';
    }
  }catch(e){
    console.error('Reaction Velocity standings write — network error:',e);
    statusEl.textContent='⚠ Couldn\'t reach the standings server — score still stands above, just not on the board';
    statusEl.style.color='#FF6B35';
  }
}
})();
</script>
</body>
</html>
